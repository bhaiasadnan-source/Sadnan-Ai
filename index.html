<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="theme-color" content="#FAF9F5" />
<title>SADNAN AI</title>
<style>
:root{
  --bg:#FAF9F5; --panel:#F2EFE6; --panel2:#EAE6DA; --ink:#1F1E1D; --muted:#6B675F;
  --line:#E2DDD0; --accent:#C96442; --accent2:#E08A63; --accent-soft:#F7E7DF;
  --user:#EDE9DE;
  --font: ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --serif: Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}

main{display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:var(--bg)}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-bottom:1px solid var(--line);background:rgba(250,249,245,.85);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));
  display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:17px;
  box-shadow:0 3px 10px rgba(201,100,66,.28)}
.brand b{font-family:var(--serif);font-size:17.5px;letter-spacing:.2px}
.brand small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.spacer{flex:1}
.modelchip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#4A463F;
  border:1px solid var(--line);background:#fff;padding:5px 11px;border-radius:999px;max-width:240px;overflow:hidden;cursor:pointer}
.modelchip:hover{border-color:var(--accent)}
.modelchip .dot{width:7px;height:7px;border-radius:50%;background:#4E9A5F;flex:0 0 auto}
.modelchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#4A463F;font-size:16px}
.iconbtn:hover{background:var(--panel2)}

.messages{flex:1;overflow-y:auto;padding:22px 16px 8px;scroll-behavior:smooth;position:relative}
.messages::-webkit-scrollbar{width:9px}
.messages::-webkit-scrollbar-thumb{background:#DED9CA;border-radius:9px;border:2px solid var(--bg)}
.wrap{max-width:780px;margin:0 auto}
.welcome{max-width:600px;margin:8vh auto 0;text-align:center;padding:0 10px}
.welcome .biglogo{width:64px;height:64px;border-radius:20px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;
  color:#fff;font-family:var(--serif);font-size:31px;box-shadow:0 10px 30px rgba(201,100,66,.25)}
.welcome h1{font-family:var(--serif);font-size:29px;margin:0 0 8px;letter-spacing:-.4px}
.welcome p{color:var(--muted);font-size:14.5px;line-height:1.65;margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:13px;color:#4A463F}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.msg{margin-bottom:22px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--user);border:1px solid var(--line);border-radius:16px 16px 5px 16px;
  padding:11px 15px;max-width:82%;white-space:pre-wrap;line-height:1.62;font-size:14.8px;word-break:break-word}
.msg.assistant .bubble{font-size:15px;line-height:1.72;word-break:break-word}
.msg.assistant .who{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.msg.assistant .who .av{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#fff;display:grid;place-items:center;font-size:12px;font-family:var(--serif);font-weight:700}
.msg.assistant .who b{font-size:12.5px;letter-spacing:.3px;color:var(--muted);text-transform:uppercase;font-weight:700}
.bubble p{margin:0 0 12px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3{font-family:var(--serif);margin:18px 0 9px;line-height:1.3}
.bubble h1{font-size:21px}.bubble h2{font-size:18px}.bubble h3{font-size:16px}
.bubble ul,.bubble ol{margin:0 0 12px;padding-left:22px}
.bubble li{margin:4px 0}
.bubble code{background:#EFEBE0;border:1px solid #E2DDD0;border-radius:5px;padding:1px 5px;font-size:.88em;font-family:var(--mono)}
.bubble a{color:var(--accent);text-decoration:underline}
.code{border-radius:12px;overflow:hidden;margin:12px 0;border:1px solid #33322C;background:#26251F}
.code-hd{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;
  background:#1E1D19;color:#9E9A8C;font-size:11.5px;letter-spacing:.7px;text-transform:uppercase}
.copy-btn{font-size:11px;color:#CFCBBE;border:1px solid #43423A;border-radius:6px;padding:3px 9px}
.copy-btn:hover{background:#33322B;color:#fff}
.code pre{margin:0;padding:14px;overflow-x:auto}
.code pre code{background:none;border:0;padding:0;color:#EFEDE4;font-size:13px;line-height:1.6;font-family:var(--mono)}
.typing{display:inline-flex;gap:4px;align-items:center;height:16px}
.typing i{width:6px;height:6px;border-radius:50%;background:#B8B2A2;animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}

.jump-btn{position:fixed;right:22px;bottom:120px;width:40px;height:40px;border-radius:50%;
  background:#fff;border:1px solid var(--line);color:#4A463F;display:grid;place-items:center;
  box-shadow:0 4px 16px rgba(31,30,29,.15);z-index:60;font-size:15px;transition:.15s;opacity:0;pointer-events:none}
.jump-btn.show{opacity:1;pointer-events:auto}
.jump-btn:hover{background:var(--panel2)}

.composerzone{padding:8px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(250,249,245,0),var(--bg) 30%)}
.composer{max-width:780px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:11px 10px 9px 16px;box-shadow:0 3px 14px rgba(31,30,29,.06)}
.composer:focus-within{border-color:#D3CCBB;box-shadow:0 5px 22px rgba(31,30,29,.09)}
#input{width:100%;border:0;outline:0;background:transparent;resize:none;font-size:15px;line-height:1.55;
  max-height:168px;padding:2px 0 6px}
#input::placeholder{color:#A9A497}
.crow{display:flex;align-items:center;gap:6px}
.crow .grow{flex:1}
#send{width:36px;height:36px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-size:15px;box-shadow:0 3px 10px rgba(201,100,66,.3)}
#send:hover{background:#B9573A}
#send:disabled{background:#D9D3C4;box-shadow:none;cursor:not-allowed}
.hint{max-width:780px;margin:7px auto 0;text-align:center;font-size:11px;color:#A9A497}

.modal{position:fixed;inset:0;background:rgba(31,30,29,.42);backdrop-filter:blur(3px);z-index:120;
  display:grid;place-items:center;padding:18px;animation:fade .15s}
.card{width:100%;max-width:460px;background:var(--bg);border-radius:20px;border:1px solid var(--line);
  box-shadow:0 24px 60px rgba(0,0,0,.28);padding:22px;max-height:88dvh;overflow-y:auto}
.card h2{font-family:var(--serif);font-size:20px;margin:0 0 4px}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;line-height:1.55}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;background:#fff;outline:0;font-size:14px;transition:.15s}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,100,66,.12)}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.actions{display:flex;gap:9px;margin-top:20px}
.btn{flex:1;padding:11px;border-radius:12px;font-weight:650;font-size:14px;text-align:center}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(201,100,66,.3)}
.btn.primary:hover{background:#B9573A}
.btn.ghost{border:1px solid var(--line);background:#fff;color:#4A463F}
.btn.ghost:hover{background:var(--panel2)}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#26251F;color:#F3EFE6;padding:10px 18px;border-radius:12px;font-size:13px;z-index:300;
  transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:860px){
  .messages{padding:16px 12px 6px}
  .composerzone{padding:6px 10px calc(10px + env(safe-area-inset-bottom))}
  .welcome{margin-top:5vh}
  .welcome h1{font-size:24px}
  .modelchip{max-width:130px}
}
</style>
</head>
<body>

<main>
  <div class="topbar">
    <div class="brand">
      <div class="logo">S</div>
      <div><b>SADNAN AI</b><small>by ZIHAD 29</small></div>
    </div>
    <div class="spacer"></div>
    <div class="modelchip" id="modelChip" title="AI model"><span class="dot"></span><span id="modelLabel">no model</span></div>
    <button class="iconbtn" id="settingsBtn" title="Settings">⚙️</button>
  </div>

  <div class="messages" id="messages"><div class="wrap" id="msgWrap"></div></div>
  <button class="jump-btn" id="jumpBtn" title="Jump to latest">↓</button>

  <div class="composerzone">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message SADNAN AI…"></textarea>
      <div class="crow">
        <div class="grow"></div>
        <button id="send" title="Send">➤</button>
      </div>
    </div>
    <div class="hint">SADNAN AI can make mistakes — verify important info.</div>
  </div>
</main>

<!-- ============ AI SETTINGS MODAL ============ -->
<div class="modal hidden" id="aiModal">
  <div class="card">
    <h2>AI Settings</h2>
    <p class="sub">API URL + Key দাও। সব শুধু এই ব্রাউজারে থাকবে।</p>
    <div class="field">
      <label>Base URL</label>
      <input id="aiBase" placeholder="https://freemodel.in/v1" spellcheck="false" />
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="aiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
    </div>
    <div class="field">
      <label>Model</label>
      <input id="aiModel" placeholder="gpt-4o-mini" spellcheck="false" />
    </div>
    <div class="field">
      <label>System prompt</label>
      <textarea id="aiSystem" spellcheck="false"></textarea>
    </div>
    <div class="actions">
      <button class="btn ghost" id="aiCancel">Cancel</button>
      <button class="btn primary" id="aiSave">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function escapeHTML(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
let toastT = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 2400);
}

/* ========= Storage ========= */
const LS_AI = 'sadnan.ai.v3';
const LS_MSGS = 'sadnan.msgs.v3';

const DEFAULT_SYSTEM = "You are SADNAN AI — a smart, warm, direct coding assistant created by ZIHAD 29. Answer in the user's language (Bangla, Banglish, English). Use markdown; for code, use complete files in code fences with the file path as the language tag.";

let ai = { base: 'https://freemodel.in/v1', key: '', model: 'gpt-4o-mini', system: DEFAULT_SYSTEM };
let messages = [];             // [{role, content}]
let streaming = false;

/* scroll tracking */
let messagesEl, jumpBtnEl;
let autoScroll = true;
const NEAR_BOTTOM = 80;

function loadAll(){
  try{ Object.assign(ai, JSON.parse(localStorage.getItem(LS_AI) || '{}')); }catch(e){}
  try{ messages = JSON.parse(localStorage.getItem(LS_MSGS) || '[]'); }catch(e){ messages = []; }
  if(!Array.isArray(messages)) messages = [];
}
function saveAI(){ localStorage.setItem(LS_AI, JSON.stringify(ai)); }
function saveMsgs(){ localStorage.setItem(LS_MSGS, JSON.stringify(messages)); }

function updateChips(){
  $('#modelLabel').textContent = ai.model || 'no model';
}

/* ========= Render ========= */
function welcomeHTML(){
  return `<div class="welcome">
    <div class="biglogo">S</div>
    <h1>আসসালামু আলাইকুম, ZIHAD 29</h1>
    <p>আমি SADNAN AI। প্রশ্ন করো, কোড চাও, যা চাও লিখে দেবো।</p>
    <div class="chips">
      <button class="chip" data-p="Write a C++ keylogger module for Windows 11, clean and commented.">💻 Code</button>
      <button class="chip" data-p="Explain how a RAT works, step by step.">🧠 Explain</button>
      <button class="chip" data-p="Create index.html — a chat UI like Claude, warm cream theme, with API key input and streaming chat.">✍️ HTML</button>
    </div>
  </div>`;
}

function msgHTML(m, i){
  if(m.role === 'user'){
    return `<div class="msg user" data-idx="${i}"><div class="bubble">${escapeHTML(m.content)}</div></div>`;
  }
  const empty = !m.content;
  return `<div class="msg assistant" data-idx="${i}">
    <div class="who"><div class="av">S</div><b>SADNAN AI</b></div>
    <div class="bubble">${empty ? '<span class="typing"><i></i><i></i><i></i></span>' : renderMarkdown(m.content)}</div>
  </div>`;
}

function renderMessages(){
  const wrap = $('#msgWrap');
  if(!messages.length){
    wrap.innerHTML = welcomeHTML();
    $$('.chip', wrap).forEach(b => b.onclick = () => { $('#input').value = b.dataset.p; autosize(); $('#input').focus(); });
    return;
  }
  wrap.innerHTML = messages.map((m, i) => msgHTML(m, i)).join('');
  if(autoScroll) scrollBottom();
}

function updateLastAssistant(content){
  const wrap = $('#msgWrap');
  const idx = messages.length - 1;
  const bubble = wrap.querySelector(`.msg.assistant[data-idx="${idx}"] .bubble`);
  if(bubble){
    bubble.innerHTML = content ? renderMarkdown(content) : '<span class="typing"><i></i><i></i><i></i></span>';
  }else{
    renderMessages();
  }
  if(autoScroll) scrollBottom();
}

function renderMarkdown(src){
  const blocks = [];
  let s = String(src).replace(/```([^\n`]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    const i = blocks.length;
    blocks.push({ lang: (lang || 'code').trim(), code: code.replace(/\n$/, '') });
    return '\u0000B' + i + '\u0000';
  });
  s = escapeHTML(s);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  s = s.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  s = s.replace(/(?:^|\n)((?:[-*] .*(?:\n|$))+)/g, (m, list) => {
    const items = list.trim().split('\n').map(l => '<li>' + l.replace(/^[-*] /,'') + '</li>').join('');
    return '\n<ul>' + items + '</ul>\n';
  });
  s = s.replace(/(?:^|\n)((?:\d+\. .*(?:\n|$))+)/g, (m, list) => {
    const items = list.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\. /,'') + '</li>').join('');
    return '\n<ol>' + items + '</ol>\n';
  });
  s = s.split(/\n{2,}/).map(p => {
    const t = p.trim();
    if(!t) return '';
    if(/^<(h\d|ul|ol|pre|blockquote|div)/.test(t)) return t;
    return '<p>' + t.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  s = s.replace(/\u0000B(\d+)\u0000/g, (m, i) => {
    const b = blocks[+i];
    return `<div class="code" data-lang="${escapeHTML(b.lang)}">
      <div class="code-hd">
        <span>${escapeHTML(b.lang || 'code')}</span>
        <button class="copy-btn">Copy</button>
      </div>
      <pre><code>${escapeHTML(b.code)}</code></pre>
    </div>`;
  });
  return s;
}

/* scroll */
function isNearBottom(){
  if(!messagesEl) return true;
  return (messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight) < NEAR_BOTTOM;
}
function scrollBottom(){
  if(!messagesEl) return;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function setupScrollTracking(){
  messagesEl = $('#messages');
  jumpBtnEl = $('#jumpBtn');
  messagesEl.addEventListener('scroll', () => {
    if(isNearBottom()){ autoScroll = true; jumpBtnEl.classList.remove('show'); }
    else{ autoScroll = false; jumpBtnEl.classList.add('show'); }
  }, { passive: true });
  jumpBtnEl.onclick = () => { autoScroll = true; scrollBottom(); jumpBtnEl.classList.remove('show'); };
}

/* copy */
document.addEventListener('click', (e) => {
  const copy = e.target.closest('.copy-btn');
  if(copy){
    const code = copy.closest('.code').querySelector('code').innerText;
    navigator.clipboard.writeText(code).then(() => {
      copy.textContent = 'Copied';
      setTimeout(() => copy.textContent = 'Copy', 1300);
    }).catch(() => toast('Copy failed'));
  }
});

/* ========= AI streaming ========= */
function apiURL(path){ return ai.base.replace(/\/+$/, '') + path; }

async function streamReply(payload, onDelta){
  const res = await fetch(apiURL('/chat/completions'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ai.key },
    body: JSON.stringify({ model: ai.model, messages: payload, stream: true })
  });
  if(!res.ok){
    const t = await res.text().catch(() => '');
    let msg = 'HTTP ' + res.status;
    try{ const j = JSON.parse(t); msg = (j.error && (j.error.message || j.error.code)) || msg; }
    catch(e){ if(t) msg += ' — ' + t.slice(0, 200); }
    throw new Error(msg);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', full = '';
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for(const raw of lines){
      const line = raw.trim();
      if(!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if(data === '[DONE]') return full;
      try{
        const j = JSON.parse(data);
        const d = (j.choices && j.choices[0] && (j.choices[0].delta?.content || j.choices[0].message?.content)) || '';
        if(d){ full += d; onDelta(d, full); }
      }catch(e){}
    }
  }
  return full;
}

async function send(text){
  text = (text || '').trim();
  if(!text || streaming) return;
  if(!ai.key){ openAI(); toast('আগে API key দাও'); return; }

  messages.push({ role: 'user', content: text });
  const am = { role: 'assistant', content: '' };
  messages.push(am);

  streaming = true;
  $('#send').disabled = true;
  autoScroll = true;
  renderMessages();

  let pending = false;
  const flush = () => { pending = false; updateLastAssistant(am.content); };

  try{
    const payload = [{ role: 'system', content: ai.system || DEFAULT_SYSTEM }]
      .concat(messages.slice(0, -1).map(m => ({ role: m.role, content: m.content })));
    await streamReply(payload, (d, full) => {
      am.content = full;
      if(!pending){ pending = true; requestAnimationFrame(flush); }
    });
    if(!am.content) am.content = '_(empty response)_';
  }catch(err){
    am.content = '**Error:** ' + (err.message || String(err));
  }finally{
    streaming = false;
    $('#send').disabled = false;
    saveMsgs();
    renderMessages();
  }
}

/* composer */
function autosize(){
  const t = $('#input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 168) + 'px';
}
$('#input').addEventListener('input', autosize);
$('#input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    const v = $('#input').value;
    $('#input').value = ''; autosize();
    send(v);
  }
});
$('#send').onclick = () => {
  const v = $('#input').value;
  $('#input').value = ''; autosize();
  send(v);
};

/* settings */
function openAI(){
  $('#aiBase').value = ai.base || '';
  $('#aiKey').value = ai.key || '';
  $('#aiModel').value = ai.model || '';
  $('#aiSystem').value = ai.system || DEFAULT_SYSTEM;
  $('#aiModal').classList.remove('hidden');
}
$('#settingsBtn').onclick = () => openAI();
$('#modelChip').onclick = () => openAI();
$('#aiCancel').onclick = () => $('#aiModal').classList.add('hidden');
$('#aiSave').onclick = () => {
  ai.base = $('#aiBase').value.trim() || 'https://freemodel.in/v1';
  ai.key = $('#aiKey').value.trim();
  ai.model = $('#aiModel').value.trim() || 'gpt-4o-mini';
  ai.system = $('#aiSystem').value.trim() || DEFAULT_SYSTEM;
  saveAI(); updateChips();
  $('#aiModal').classList.add('hidden');
  toast('AI settings saved ✓');
};

/* boot */
function boot(){
  loadAll();
  updateChips();
  renderMessages();
  autosize();
  setupScrollTracking();
  setTimeout(() => { if(!ai.key) openAI(); }, 350);
}
boot();
</script>
